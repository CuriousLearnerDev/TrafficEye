# 模块功能: 核心处理模块：处理 HTTP 请求/响应数据的解析和转换
# 作者: W啥都学
# 创建日期: 2025-02-27
# 修改时间：2025-04-19

# 识别log文件内容类型
log_formats:
  f5_healthcheck: '^\d+\.\d+\.\d+\.\d+\s+-\s+-\s+\[.*\]\s+"GET\s+/f5[_\w]+\s+HTTP/1\.1"\s+\d+\s+\d+'
  apache_access: '^\d+\.\d+\.\d+\.\d+\s+-\s+-\s+\[\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2}\s+[+-]\d{4}\]\s+"\w+\s+[^"]+\s+HTTP/\d\.\d"\s+\d+\s+\d+'
  nginx_access: '^\d+\.\d+\.\d+\.\d+\s+-\s+-\s+\[\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2}\s+[+-]\d{4}\]\s+"\w+\s+[^"]+\s+HTTP/\d\.\d"\s+\d+\s+\d+\s+"[^"]*"\s+"[^"]*"'
  json_log: '^\s*\{.*\}\s*$'
  haproxy_access: '^\w{3}\s+\d+\s+\d+:\d+:\d+\s+\S+\s+haproxy\[\d+\]:\s+\d+\.\d+\.\d+\.\d+:\d+\s+\[.+\]\s+.+\s+.+\s+\d+/\d+/\d+/\d+/\d+\s+\d+\s+\d+\s+.+\s+".+"$'
  iis_log: '^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+\S+\s+[A-Z]+\s+\S+\s+\S+\s+\d+\s+\S+\s+[\d\.]+\s+.+\s+\d{3}\s+\d+\s+\d+\s+\d+'
  tomcat_access_log: '^\d+\.\d+\.\d+\.\d+\s+-\s+-\s+\[\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2}\s+[+-]\d{4}\]\s+"\w+\s+\S+\s+HTTP/[\d.]+"\s+\d+\s+\d+'

# 匹配出来数据
parsers:
  iis_log: '(?P<date>\d{4}-\d{2}-\d{2})\s+(?P<time>\d{2}:\d{2}:\d{2})\s+(?P<s_ip>\S+)\s+(?P<method>[A-Z]+)\s+(?P<path>\S+)\s+(?P<query>\S+)\s+(?P<port>\d+)\s+(?P<username>\S+)\s+(?P<client_ip>[0-9a-fA-F:.]+)\s+(?P<user_agent>.+?)\s+(?P<status_code>\d{3})\s+\d+\s+\d+\s+(?P<time_taken>\d+)'
  haproxy_access: '\S+\s+\S+\s+\S+\s+\[\d+\]:\s+(?P<ip>[0-9a-fA-F:.]+):\d+\s+\[(?P<timestamp>[^\]]+)\]\s+(?P<frontend>\S+)\s+(?P<backend>\S+/\S+)\s+\d+/\d+/\d+/\d+/\d+\s+(?P<status_code>\d{3})\s+(?P<size>\d+)\s+[^"]*"(?P<method>[A-Z]+)\s+(?P<path>[^ ]+)\s+HTTP/[^"]+"'
  #  access_log1: '(?P<ip>[0-9a-fA-F:.]+)\s+[^ ]+\s+[^ ]+\s+\[(?P<time>[^\]]+)\]\s+"(?P<method>[A-Z]+)\s+(?P<path>[^ ]+)\s+HTTP/[^"]+"\s+(?P<status_code>\d{3})\s+(?P<size>\d+|-)\s+"(?P<referer>[^"]*)"\s+"(?P<user_agent>[^"]*)"'
  #  access_log2: '^(?P<ip>[0-9.]+)\s+\S+\s+\S+\s+\[(?P<time>[^\]]+)\]\s+"(?P<method>[A-Z]+)\s+(?P<path>\S+)\s+HTTP/[0-9.]+"\s+(?P<status_code>\d{3})\s+(?P<size>\d+|-)\s+(?P<vhost>\S+)\s+"(?P<referrer>[^"]*)"\s+"(?P<user_agent>[^"]*)"'
  common_web_log: '(?P<ip>[0-9a-fA-F:.]+)\s+\S+\s+\S+\s+\[(?P<time>[^\]]+)\]\s+"(?P<method>[A-Z]+)\s+(?P<path>\S+)\s+HTTP/[0-9.]+"\s+(?P<status_code>\d{3})\s+(?P<size>\d+|-)(?:\s+(?P<vhost>\S+))?\s+"(?P<referrer>[^"]*)"\s+"(?P<user_agent>[^"]*)"'

# 安全检测
safety_testing:
  Directory_Traversal_Attack:
    name:
      - "路径遍历攻击 (/../) 或 (/.../)有效载荷"
    detection_location:
      - 'URI|forms_key_body|multipart_file_name_body|ALL_headers|xml_value_body|!headers:referer'
    rules:
      - >-
        (?:(?:^|[\x5c/;])\.{2,3}[\x5c/;]|[\x5c/;]\.{2,3}[\x5c/;])
    severity:
      - 中危
  suffix_detection:
    name:
      - "敏感文件泄露"
    detection_location:
      - 'URI'
    rules:
      - >-
        \.(?:bash_history|git|sh|bash|csh|zsh|ps|git\\config|npm\\_logs|env|swp|bak|old|backup|sql|db|mdb|log|cfg|conf|config|ini|txt|xml|json|yml|yaml|pem|key|crt|cer|ppk|rdp|ovpn|kdbx|DS_Store|htaccess|htpasswd|gitignore|svn|hg|cvs|idea|vscode|sublime-project|sublime-workspace)$
      - >-
        /(?:\.git/|\.svn/|\.hg/|\.DS_Store|\.env|\.htaccess|\.htpasswd|\.bash_history|\.ssh/|\.npm/|\.cache/|\.config/|\.local/|\.docker/|\.kube/)
    severity:
      - INFO
      - INFO

  directory_traversal_attack:
    name:
      - "路径遍历攻击 /../ 有效载荷"
    detection_location:
      - 'URI|forms_key_body|multipart_file_name_body|ALL_headers|xml_value_body|!headers:referer'
    rules:
      - >-
        (?i)(?:[/\x5c]|%(?:2(?:f|5(?:2f|5c|c(?:1%259c|0%25af))|%46)|5c|c(?:0%(?:[2aq]f|5c|9v)|1%(?:[19p]c|8s|af))|(?:bg%q|(?:e|f(?:8%8)?0%8)0%80%a)f|u(?:221[56]|EFC8|F025|002f)|%3(?:2(?:%(?:%6|4)6|F)|5%%63)|1u)|0x(?:2f|5c))(?:\.(?:%0[01]|\?)?|\?\.?|%(?:2(?:(?:5(?:2|c0%25a))?e|%45)|c0(?:\.|%[256aef]e)|u(?:(?:ff0|002)e|2024)|%32(?:%(?:%6|4)5|E)|(?:e|f(?:(?:8|c%80)%8)?0%8)0%80%ae)|0x2e){2,3}(?:[/\x5c]|%(?:2(?:f|5(?:2f|5c|c(?:1%259c|0%25af))|%46)|5c|c(?:0%(?:[2aq]f|5c|9v)|1%(?:[19p]c|8s|af))|(?:bg%q|(?:e|f(?:8%8)?0%8)0%80%a)f|u(?:221[56]|EFC8|F025|002f)|%3(?:2(?:%(?:%6|4)6|F)|5%%63)|1u)|0x(?:2f|5c))
    severity:
      - 中危

  directory_traversal_attack_FromFile:
    name:
      - "本地文件包含"
    detection_location:
      - 'headers:user-agent|headers:referer'
    rules:
      - >-
        lfi-os-files.rule
    severity:
      - 中危


  Directory_traversal_file_attack:
    name:
      - "路径遍历攻击 文件后缀检测"
    detection_location:
      - 'URI|URI_value|ALL_headers|multipart_data_body|xml_value_body'
    rules:
      - >-
        (?:\.(?:cgi|sh|zsh|py|pl|rb|ssh|cfm))
    severity:
      - 中危

  XXE_detection:
    name:
      - "XXE（XML External Entity）攻击"
    detection_location:
      - 'binary'
    rules:
      - >-
        (?:\xff\xfe)?<\x00\?\x00x\x00m\x00l\x00
    severity:
      - 高危

  fastjson_detection:
    name:
      - "Fastjson漏洞：常见@type注入"
      - "Fastjson漏洞：使用攻击类"
    detection_location:
      - 'json_body'
      - 'json_value_body|json_body'
    rules:
      - >-
        (?i)"[^"]*?@type[^"]*?"\s*:
      - >-
        (?i)(java\.net\.URL|java\.net\.Inet6Address|Exception|com\.sun\.rowset\.JdbcRowSetImpl|javax\.sql\.rowset\.JdbcRowSetImpl|org\.apache\.commons\.collections\..*|org\.apache\.commons\.beanutils\.BeanComparator|org\.codehaus\.groovy\.runtime\..*|com\.sun\.org\.apache\.xalan\.internal\.xsltc\.trax\.TemplatesImpl|com\.sun\.org\.apache\.bcel\.internal\.util\.ClassLoader|org\.springframework\.beans\.factory\.ObjectFactory|org\.yaml\.snakeyaml\.Yaml|org\.hibernate\.engine\.jdbc\.internal\.ProxyFactoryFactoryImpl|org\.mozilla\.javascript\.Context|org\.apache\.tomcat\.dbcp\.dbcp2\.BasicDataSource)
    severity:
      - 高危
      - 高危

  Java_code_check:
    name:
      - "Java 代码检测"
    detection_location:
      - 'r_body'
    rules:
      - >-
        (<jsp:|javax\.servlet|\.addheader|\.createtextfile|\.getfile|\.loadfromfile|response\.binarywrite|response\.write|scripting\.filesystemobject|server\.createobject|server\.execute|server\.htmlencode|server\.mappath|server\.urlencode|vbscript\.encode|wscript\.network|wscript\.shell|\.getparameter|\.getquerystring|\.getinputstream|\.getwriter|\.eval|\.include|<%@ page|<%!|<%=|<% |\.createStatement|\.executeQuery|\.executeUpdate)
    severity:
      - 高危

  Java_code_error_check:
    name:
      - "Java 代码报错"
    detection_location:
      - 'r_body'
    rules:
      - >-
        (java\.lang\.|class java\.lang\.|java\.lang\.NullPointerException|java\.rmi\.ServerException|onclick=\"toggle\('full exception chain stacktrace'\)\"|at org\.apache\.catalina|at org\.apache\.coyote\.|at org\.apache\.tomcat\.|at org\.apache\.jasper\.)
    severity:
      - 高危


  currency_unix_command_injection_check:
    name:
      - "Linux通用命令执行注入检测规则"
    detection_location:
      - 'headers:cookie|URI_key|URI_value|forms_key_body|forms_value_body|json_key_body|json_value_body|xml_value_body|xml_attribute_body'
    rules:
      - >-
        (?:;|\{|\||\|\||&|&&|\n|\r|\$\(|\$\(\(|`|\${|<\(|>\(|\(\s*\))\s*(?:{|\s*\(\s*|\w+=(?:[^\s]*|\$.*|\$.*|<.*|>.*|\'.*\'|\".*\")\s+|!\s*|\$)*\s*(?:'|\")*(?:[\?\*\[\]\(\)\-\|+\w'\"\./\\\\]+/)?[\\\\'\"]*(?:l[\\\\'\"]*(?:w[\\\\'\"]*p[\\\\'\"]*-[\\\\'\"]*(?:d[\\\\'\"]*(?:o[\\\\'\"]*w[\\\\'\"]*n[\\\\'\"]*l[\\\\'\"]*o[\\\\'\"]*a[\\\\'\"]*d|u[\\\\'\"]*m[\\\\'\"]*p)|r[\\\\'\"]*e[\\\\'\"]*q[\\\\'\"]*u[\\\\'\"]*e[\\\\'\"]*s[\\\\'\"]*t|m[\\\\'\"]*i[\\\\'\"]*r[\\\\'\"]*r[\\\\'\"]*o[\\\\'\"]*r)|s(?:[\\\\'\"]*(?:b[\\\\'\"]*_[\\\\'\"]*r[\\\\'\"]*e[\\\\'\"]*l[\\\\'\"]*e[\\\\'\"]*a[\\\\'\"]*s[\\\\'\"]*e|c[\\\\'\"]*p[\\\\'\"]*u|m[\\\\'\"]*o[\\\\'\"]*d|p[\\\\'\"]*c[\\\\'\"]*i|u[\\\\'\"]*s[\\\\'\"]*b|-[\\\\'\"]*F|h[\\\\'\"]*w|o[\\\\'\"]*f))?|z[\\\\'\"]*(?:(?:[ef][\\\\'\"]*)?g[\\\\'\"]*r[\\\\'\"]*e[\\\\'\"]*p|c[\\\\'\"]*(?:a[\\\\'\"]*t|m[\\\\'\"]*p)|m[\\\\'\"]*(?:o[\\\\'\"]*r[\\\\'\"]*e|a)|d[\\\\'\"]*i[\\\\'\"]*f[\\\\'\"]*f|l[\\\\'\"]*e[\\\\'\"]*s[\\\\'\"]*s)|e[\\\\'\"]*s[\\\\'\"]*s[\\\\'\"]*(?:(?:f[\\\\'\"]*i[\\\\'\"]*l|p[\\\\'\"]*i[\\\\'\"]*p)[\\\\'\"]*e|e[\\\\'\"]*c[\\\\'\"]*h[\\\\'\"]*o|(?:\s|<|>).*)|a[\\\\'\"]*s[\\\\'\"]*t[\\\\'\"]*(?:l[\\\\'\"]*o[\\\\'\"]*g(?:[\\\\'\"]*i[\\\\'\"]*n)?|c[\\\\'\"]*o[\\\\'\"]*m[\\\\'\"]*m|(?:\s|<|>).*)|o[\\\\'\"]*(?:c[\\\\'\"]*a[\\\\'\"]*(?:t[\\\\'\"]*e|l)[\\\\'\"]*(?:\s|<|>).*|g[\\\\'\"]*n[\\\\'\"]*a[\\\\'\"]*m[\\\\'\"]*e)|d[\\\\'\"]*(?:c[\\\\'\"]*o[\\\\'\"]*n[\\\\'\"]*f[\\\\'\"]*i[\\\\'\"]*g|d[\\\\'\"]*(?:\s|<|>).*)|f[\\\\'\"]*t[\\\\'\"]*p(?:[\\\\'\"]*g[\\\\'\"]*e[\\\\'\"]*t)?|(?:[np]|y[\\\\'\"]*n[\\\\'\"]*x)[\\\\'\"]*(?:\s|<|>).*)|b[\\\\'\"]*(?:z[\\\\'\"]*(?:(?:[ef][\\\\'\"]*)?g[\\\\'\"]*r[\\\\'\"]*e[\\\\'\"]*p|d[\\\\'\"]*i[\\\\'\"]*f[\\\\'\"]*f|l[\\\\'\"]*e[\\\\'\"]*s[\\\\'\"]*s|m[\\\\'\"]*o[\\\\'\"]*r[\\\\'\"]*e|c[\\\\'\"]*a[\\\\'\"]*t|i[\\\\'\"]*p[\\\\'\"]*2)|s[\\\\'\"]*d[\\\\'\"]*(?:c[\\\\'\"]*a[\\\\'\"]*t|i[\\\\'\"]*f[\\\\'\"]*f|t[\\\\'\"]*a[\\\\'\"]*r)|a[\\\\'\"]*(?:t[\\\\'\"]*c[\\\\'\"]*h[\\\\'\"]*(?:\s|<|>).*|s[\\\\'\"]*h)|r[\\\\'\"]*e[